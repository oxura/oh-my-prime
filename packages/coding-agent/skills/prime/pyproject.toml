[project]
name = "oh-my-prime-prooftree"
version = "0.1.0"
description = "Oh My Prime isolated speculative exploration and verified candidate selection"
requires-python = ">=3.10"
dependencies = [
  "oh-my-prime-prove",
  "oh-my-prime-workspace",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime"]
