[project]
name = "oh-my-prime-code-atlas"
version = "0.1.0"
description = "Oh My Prime semantic repository graph and context compiler"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.hatch.build]
include = [
  "src/atlas/**/*.py",
  "src/atlas/*.mjs",
]
