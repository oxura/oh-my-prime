[project]
name = "oh-my-prime-prove"
version = "0.1.0"
description = "Oh My Prime acceptance contracts and deterministic verifier fabric"
requires-python = ">=3.10"
dependencies = [
  "oh-my-prime-workspace",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prove"]
